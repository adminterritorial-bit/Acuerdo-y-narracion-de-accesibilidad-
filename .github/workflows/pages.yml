name: Publicar consulta accesible en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validar y preparar sitio
    runs-on: ubuntu-latest
    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4

      - name: Verificar archivo principal y rutas
        shell: bash
        run: |
          test -s index.html
          test -s app.js
          test -s pages.js
          grep -q 'lang="es-CO"' index.html
          grep -q 'id="lengua-senas"' index.html
          grep -q 'id="userAudio"' index.html
          grep -q 'id="userVideo"' index.html
          grep -q 'id="voicePicker"' index.html
          grep -q 'id="documento"' index.html
          grep -q 'window.ACUERDO_PAGES=' pages.js
          if grep -E 'audio_completo_preliminar|audios/pagina_[0-9]+' index.html; then
            echo "No se debe publicar el audio robótico anterior"
            exit 1
          fi
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='_site' --exclude='*.zip' --exclude='*.md' --exclude='.github' ./ _site/
          touch _site/.nojekyll

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir contenido
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Publicar GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
